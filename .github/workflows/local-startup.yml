name: Local startup verification
on:
  push:
    branches: [fix/local-startup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Vendor existing startup resources (or verify pinned files)
        run: python3 tools/vendor-startup.py
      - name: Install isolated test dependencies
        run: npm install --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Install test browsers
        run: npx --prefix tools playwright install --with-deps chromium webkit
      - name: Verify mobile modes, fonts, sizes and network failures
        run: node tools/test-startup.mjs
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-startup-verification
          path: |
            test-results/
            docs/startup-report.*
          retention-days: 7
      - name: Commit only verified resources to the work branch
        if: github.ref == 'refs/heads/fix/local-startup'
        run: |
          git add index.html README.md .nojekyll vendor tools/fixtures tools/package-lock.json docs/startup-report.json docs/startup-report.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Make startup self-contained; preserve r128 and fonts; verify mobile modes'
            git push origin HEAD:fix/local-startup
          fi
