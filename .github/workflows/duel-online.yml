name: Duel online
on:
  push:
    branches: [main, feature/cans-ai-opponent]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duel-online-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/cans-ai-opponent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm ci --prefix tools --no-audit --no-fund
      - run: npx --prefix tools playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tools/test-distractions.mjs
      - run: npx wrangler deploy --dry-run
      - name: Deploy the separate Duel Worker when credentials are configured
        if: github.ref == 'refs/heads/feature/cans-ai-opponent'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npm run deploy
          else
            echo '::notice::Tests passed. Connect Cloudflare or configure the two deployment secrets to publish Duel.'
          fi
      - name: Save browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-online-verification
          path: test-results/duel-*
          retention-days: 7
