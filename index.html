function setStyle(v){
  const changed=ballStyle!==v; noteStyle(v);
  ballStyle=v; if(changed) makePaper(true); for(const b of styleBtns) b.setAttribute('aria-pressed',b.dataset.style===v);
  try{ localStorage.setItem('dahrooj-style',v); }catch(_){}
}
for(const b of styleBtns) b.addEventListener('click',()=>{ setStyle(b.dataset.style); showTitle(b.getAttribute('aria-label')); });
setStyle(ballStyle);
const elTitle=document.getElementById('title');
let titleTimer=0;
function showTitle(text){
  elTitle.textContent=text; elTitle.classList.remove('show'); void elTitle.offsetWidth; elTitle.classList.add('show');
  clearTimeout(titleTimer); titleTimer=setTimeout(()=>elTitle.classList.remove('show'),1400);
}
function setMode(m){
  if(intro) return;
  if(m===mode&&m==='opponent')return;
  if(m!=='free'){
    if(!G3){ G3=make3D(); if(!G3) return; }
    G3.setStage(m);
  }else if(G3)G3.leaveStage();
  mode=m;
  elCount.classList.toggle('duel',m==='opponent');
  for(const b of modeBtns) b.setAttribute('aria-pressed',b.dataset.mode===m);
  gcv.hidden = fxc.hidden = m==='free';
  showCount();
  const btn=modeBtns.find(b=>b.dataset.mode===m); if(btn) showTitle(btn.getAttribute('aria-label'));
}
for(const b of modeBtns) b.addEventListener('click',()=>setMode(b.dataset.mode));

resize();
// Reuse the exact five game renderers. Cache their output for the many-ball intro.
function makeStartBallSprite(style,face,blinkOn=false){
  const previousStyle=ballStyle, radius=64;
  const sprite=document.createElement('canvas');
  sprite.width=sprite.height=Math.ceil(radius*2.8*dpr);
  const g=sprite.getContext('2d');
  g.scale(dpr,dpr);g.translate(radius*1.4,radius*1.4);
  const points=Array.from({length:28},(_,i)=>{
    const a=i/28*Math.PI*2-Math.PI/2;
    return {x:Math.cos(a)*radius,y:Math.sin(a)*radius};
  });
  try{
    ballStyle=style;
    paintBlob(g,points,0,0,radius,1,1,face,0,0,0,blinkOn);
  }finally{ballStyle=previousStyle;}
  return sprite;
}
function enterGame(){
  ensureAudio();
  if(intro){intro.destroy();intro=null;}
  const ui=document.getElementById('game-ui');ui.hidden=false;ui.inert=false;
  cv.removeAttribute('aria-hidden');
  last=performance.now();
  document.querySelector('[data-mode="free"]').focus({preventScroll:true});
  showTitle('Dahrooj');
}
function startPopSound(){
  if(!audio || audio.state!=='running') return;
  const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
  o.type='sine';o.frequency.setValueAtTime(780,t);o.frequency.exponentialRampToValueAtTime(140,t+.09);
  g.gain.setValueAtTime(.065,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);
  o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.11);
}
let last=performance.now();
if(window.Matter && window.createDahroojStart){
  cv.setAttribute('aria-hidden','true');
  intro=window.createDahroojStart({root:document.getElementById('start-screen'),canvas:document.getElementById('start-balls'),makeSprite:makeStartBallSprite,onStart:enterGame,reducedMotion:reduce,onInteract:ensureAudio,onPop:startPopSound});
}else{
  // A missing optional intro file must not prevent access to the game.
  document.getElementById('start-screen').remove();enterGame();
}
function frame(now){
  const elapsed=Math.max(0,(now-last)/1000);last=now;
  const dt=Math.max(.001,Math.min(0.033,elapsed));
  const steps=3;
  if(intro){
    drawPaper();intro.tick(Math.min(.067,elapsed));
  }else if(mode==='free'){
    for(let i=0;i<8;i++) update(dt/8);
    render();
  } else {
    time+=dt;
    for(let i=0;i<steps;i++) G3.update(dt/steps);
    drawPaper();
    G3.render();
  }
  requestAnimationFrame(frame);
}
ball.y=floorY-R-H*0.35; ball.vy=0; ball.grounded=false; jellyInit(ball.x,ball.y);
requestAnimationFrame(frame);
// Optional analytics starts only after the first game frame, never in its critical path.
requestAnimationFrame(()=>{
  const startCounter=()=>{ void initVisits(); };
  if('requestIdleCallback' in window) window.requestIdleCallback(startCounter,{timeout:2000});
  else setTimeout(startCounter,250);
});
})();
</script>
